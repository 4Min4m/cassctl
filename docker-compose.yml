name: cassctl-lab

x-cassandra-common: &cassandra-common
  image: cassandra:4.1
  restart: on-failure
  environment: &cassandra-env
    CASSANDRA_CLUSTER_NAME: cassctl-lab
    CASSANDRA_SEEDS: cass1
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    CASSANDRA_DC: dc1
    CASSANDRA_RACK: rack1
    MAX_HEAP_SIZE: 256M
    HEAP_NEWSIZE: 64M
  healthcheck:
    test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' >/dev/null 2>&1 || exit 1"]
    interval: 20s
    timeout: 10s
    retries: 20
    start_period: 180s

services:
  cass1:
    <<: *cassandra-common
    container_name: cass1
    ports:
      - "9042:9042"
    volumes:
      - cass1-data:/var/lib/cassandra

  cass2:
    <<: *cassandra-common
    container_name: cass2
    depends_on:
      cass1:
        condition: service_healthy
    volumes:
      - cass2-data:/var/lib/cassandra

  cass3:
    <<: *cassandra-common
    container_name: cass3
    depends_on:
      cass1:
        condition: service_healthy
    volumes:
      - cass3-data:/var/lib/cassandra

volumes:
  cass1-data:
  cass2-data:
  cass3-data: