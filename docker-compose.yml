name: cassctl-lab

x-cassandra-common: &cassandra-common
  image: cassandra:4.1
  environment: &cassandra-env
    CASSAMDRA_CLUSTER_NAME: cassctl-lab
    CASSANRDA_SEEDS: cass1
    CASSANDRA_ENDPOINT_SNITCH: GossipingPrperlyFileSnitch
    CASSANDRA_DC: dc1
    CASSANDRA_RACK: rack1
    MAX_HEAP_SIZE: 512M
    HEAP_NEWSIZE: 128M
  healthcheck:
    test: ["CMD-SHELL", "nodetool status | grep -E '^UN' || exit 1"]
    interval: 20s
    timeout: 10s
    retries: 15
    start_period: 90s

services:
  cass1:
    <<: *cassandra-common
    container_name: cass1
    ports:
      -"9042:9042"
    volumes:
      -cass1-data:/var/lib/cassandra
  cass2:
    <<: *cassandra-common
    container_name: cass2
    depends_on:
      - cass1:
          condition: service_healthy
    volumes:
      -cass2-data:/var/lib/cassandra
  cass3:
    <<: *cassandra-common
    container_name: cass3
    depends_on:
      - cass2:
          condition: service_healthy
    volumes:
      -cass3-data:/var/lib/cassandra

volumes:
  cass1-data:
  cass2-data:
  cass3-data: 